name: OIDC lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Show the OIDC token claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r .value)
          python3 -c "
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          keys = ('sub', 'aud', 'repository', 'ref', 'environment')
          print(json.dumps({k: claims[k] for k in keys if k in claims}, indent=2))
          " "$TOKEN"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prove it worked
        run: |
          az account show
          az group show --name rg-oidc-lab-dev --query name -o tsv
